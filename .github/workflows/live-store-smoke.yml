name: Live storefront smoke test

on:
  workflow_dispatch:
    inputs:
      acknowledge_live_requests:
        description: "Confirm that you are authorised to test these public storefronts and that robots.txt will be respected."
        required: true
        type: boolean
        default: false

jobs:
  smoke:
    if: ${{ inputs.acknowledge_live_requests }}
    # Use Ubuntu 24.04 with a Playwright release whose browser dependency
    # metadata supports Noble's libasound2t64 package naming.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0 beautifulsoup4==4.12.3 lxml==5.1.0
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Verify Chromium launches
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(headless=True)
                  page = await browser.new_page()
                  await page.set_content("<title>browser-ready</title>")
                  assert await page.title() == "browser-ready"
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Run bounded live checks
        run: python scripts/live_store_smoke.py --output artifacts/store-smoke.json
        env:
          # Executing a script by path puts backend/scripts on sys.path;
          # add backend itself so imports such as app.core.* resolve.
          PYTHONPATH: ${{ github.workspace }}/backend
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-store-smoke-report
          path: backend/artifacts/store-smoke.json
          if-no-files-found: ignore
